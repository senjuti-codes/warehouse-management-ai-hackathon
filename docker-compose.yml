services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 8000
      WORKBOOK_PATH: ../data/Warehouse_AI_Hackathon_Synthetic_Dataset_FINAL.xlsx
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
      - backend-data:/app/state
    working_dir: /app/state
    command: ["node", "--experimental-strip-types", "/app/src/server.ts"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-data:
